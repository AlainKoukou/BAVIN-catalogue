<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVIN Wholesale Catalogue - Lebanon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function renderCatalogue() {
            let saved = localStorage.getItem("bavin_products");
            let products = saved ? JSON.parse(saved) : [
                { id: 1, name: "BAVIN BH-50", category: "Audio", price: "14.50", code: "BH-50", desc: "Wireless Stereo Headphone, Bluetooth 5.3", img: "" },
                { id: 2, name: "BAVIN BH-39", category: "Audio", price: "18.00", code: "BH-39", desc: "Active Noise Reduction, Hi-Res Audio", img: "" },
                { id: 3, name: "BAVIN PC1185", category: "Power Banks", price: "9.00", code: "PC1185", desc: "10000mAh Power Bank, 22.5W Fast Charging", img: "" }
            ];

            let audioGrid = document.getElementById("audio-grid");
            let powerGrid = document.getElementById("power-grid");
            
            audioGrid.innerHTML = "";
            powerGrid.innerHTML = "";

            products.forEach(p => {
                let cardHTML = `
                    <div class="bg-white border rounded-xl p-5 shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="text-xs font-bold bg-slate-900 text-white px-2.5 py-1 rounded">${p.code}</span>
                            <div class="h-40 bg-gray-100 rounded-lg my-4 flex items-center justify-center text-gray-400 text-sm overflow-hidden">
                                ${p.img ? `<img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover">` : `<span>${p.name} Preview</span>`}
                            </div>
                            <h4 class="font-bold text-lg text-slate-900">${p.name}</h4>
                            <p class="text-xs text-gray-500 mt-1">${p.desc}</p>
                        </div>
                        <div class="mt-4 pt-4 border-t flex justify-between items-center">
                            <span class="text-xs text-gray-400 uppercase font-semibold">Wholesale Price</span>
                            <span class="text-emerald-600 font-bold text-lg">$${p.price}</span>
                        </div>
                    </div>
                `;

                if (p.category === "Audio") {
                    audioGrid.innerHTML += cardHTML;
                } else {
                    powerGrid.innerHTML += cardHTML;
                }
            });
        }
        window.onload = renderCatalogue;
    </script>
</head>
<body class="bg-gray-50 text-slate-800">
    <header class="bg-slate-900 text-white py-6 px-8 shadow-md border-b-4 border-emerald-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold tracking-wider text-emerald-400">BAVIN</h1>
                <p class="text-sm text-gray-400 uppercase tracking-widest mt-1">Official Wholesale & Distribution Catalogue • Lebanon</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-4">
                <span class="bg-emerald-500 text-slate-900 text-xs font-bold px-3 py-1 rounded-full uppercase">Direct B2B Pricing</span>
                <a href="admin.html" class="text-xs text-gray-400 hover:text-white underline">Admin Login</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="bg-white border-l-4 border-emerald-500 p-6 rounded-r-lg shadow-sm mb-12">
            <h2 class="text-lg font-semibold text-slate-900">Curated Stock Selection for Retailers</h2>
            <p class="text-sm text-gray-600 mt-1">Ready-to-sell, premium-packaged BAVIN mobile accessories with high consumer demand across Lebanese stores.</p>
        </div>

        <!-- Audio Section -->
        <section class="mb-12">
            <h3 class="text-xl font-bold text-slate-900 border-b border-gray-200 pb-2 mb-6 flex items-center">
                <span class="w-3 h-3 bg-emerald-500 rounded-full mr-2"></span> Audio & Wireless Headsets
            </h3>
            <div id="audio-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Injected dynamically -->
            </div>
        </section>

        <!-- Power Banks Section -->
        <section class="mb-12">
            <h3 class="text-xl font-bold text-slate-900 border-b border-gray-200 pb-2 mb-6 flex items-center">
                <span class="w-3 h-3 bg-emerald-500 rounded-full mr-2"></span> Power Banks & Fast Chargers
            </h3>
            <div id="power-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Injected dynamically -->
            </div>
        </section>
    </main>
</body>
</html>

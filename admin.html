<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVIN Catalogue - Management Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold">BAVIN Admin Control Panel</h1>
        <a href="index.html" class="text-xs bg-emerald-600 px-3 py-1.5 rounded font-semibold">View Live Catalogue</a>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
        <h2 class="text-xl font-bold mb-4 text-slate-800">Quick Price & Item Editor</h2>
        <p class="text-sm text-gray-600 mb-6">Use this panel to manage items displayed on your domain network.</p>
        
        <div class="space-y-4">
            <div class="p-4 border rounded-lg flex justify-between items-center bg-gray-50">
                <div>
                    <span class="font-bold text-slate-900">BH-50 Wireless Stereo Headphone</span>
                    <p class="text-xs text-gray-500">Current Price: $14.50</p>
                </div>
                <button onclick="alert('Price update interface ready for deployment')" class="bg-slate-900 text-white px-4 py-2 rounded text-xs font-bold">Edit Price</button>
            </div>
            <div class="p-4 border rounded-lg flex justify-between items-center bg-gray-50">
                <div>
                    <span class="font-bold text-slate-900">BH-39 Active Noise Reduction</span>
                    <p class="text-xs text-gray-500">Current Price: $18.00</p>
                </div>
                <button onclick="alert('Price update interface ready for deployment')" class="bg-slate-900 text-white px-4 py-2 rounded text-xs font-bold">Edit Price</button>
            </div>
        </div>
    </div>
</body>
</html>

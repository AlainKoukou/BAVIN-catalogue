<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAVIN Catalogue - Management Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function checkPassword() {
            const pass = document.getElementById("admin-pass").value;
            if (pass === "bavin2026") {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("admin-content").classList.remove("hidden");
                loadAdminProducts();
            } else {
                alert("Incorrect Password!");
            }
        }

        function getProducts() {
            let saved = localStorage.getItem("bavin_products");
            if (saved) {
                return JSON.parse(saved);
            }
            return [
                { id: 1, name: "BAVIN BH-50", category: "Audio", price: "15.00", code: "BH-50", desc: "Wireless Stereo Headphone, Bluetooth 5.3", img: "./bh50.jpg" }
            ];
        }

        function loadAdminProducts() {
            let products = getProducts();
            let container = document.getElementById("admin-product-list");
            container.innerHTML = "";

            products.forEach((p, index) => {
                container.innerHTML += `
                    <div class="p-5 border rounded-lg bg-gray-50 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold bg-slate-900 text-white px-2 py-0.5 rounded">Item #${index + 1}</span>
                            <button onclick="deleteProduct(${index})" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-red-700">Delete Item</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Product Name</label>
                                <input type="text" id="name-${index}" value="${p.name}" class="w-full p-2 border rounded text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Model Code</label>
                                <input type="text" id="code-${index}" value="${p.code}" class="w-full p-2 border rounded text-sm bg-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Category</label>
                                <select id="cat-${index}" class="w-full p-2 border rounded text-sm bg-white">
                                    <option value="Audio" ${p.category === 'Audio' ? 'selected' : ''}>Audio & Wireless Headsets</option>
                                    <option value="Power Banks" ${p.category === 'Power Banks' ? 'selected' : ''}>Power Banks & Chargers</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Wholesale Price ($)</label>
                                <input type="text" id="price-${index}" value="${p.price}" class="w-full p-2 border rounded text-sm bg-white">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Description</label>
                                <input type="text" id="desc-${index}" value="${p.desc}" class="w-full p-2 border rounded text-sm bg-white">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Image Path / URL (e.g., ./bh50.jpg)</label>
                                <input type="text" id="img-${index}" value="${p.img || ''}" class="w-full p-2 border rounded text-sm bg-white">
                            </div>
                        </div>
                        <div class="text-right pt-2">
                            <button onclick="updateProduct(${index})" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-blue-700">Save Changes</button>
                        </div>
                    </div>
                `;
            });
        }

        function addProduct(event) {
            event.preventDefault();
            let products = getProducts();
            
            let newProduct = {
                id: Date.now(),
                name: document.getElementById("new-name").value,
                code: document.getElementById("new-code").value,
                category: document.getElementById("new-category").value,
                price: document.getElementById("new-price").value,
                desc: document.getElementById("new-desc").value,
                img: document.getElementById("new-img").value
            };

            products.push(newProduct);
            localStorage.setItem("bavin_products", JSON.stringify(products));
            
            document.getElementById("add-product-form").reset();
            loadAdminProducts();
            alert("Product added successfully!");
        }

        function updateProduct(index) {
            let products = getProducts();
            products[index].name = document.getElementById(`name-${index}`).value;
            products[index].code = document.getElementById(`code-${index}`).value;
            products[index].category = document.getElementById(`cat-${index}`).value;
            products[index].price = document.getElementById(`price-${index}`).value;
            products[index].desc = document.getElementById(`desc-${index}`).value;
            products[index].img = document.getElementById(`img-${index}`).value;

            localStorage.setItem("bavin_products", JSON.stringify(products));
            loadAdminProducts();
            alert("Product updated successfully! Changes are now live on the catalogue.");
        }

        function deleteProduct(index) {
            if (confirm("Are you sure you want to delete this product?")) {
                let products = getProducts();
                products.splice(index, 1);
                localStorage.setItem("bavin_products", JSON.stringify(products));
                loadAdminProducts();
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen">
    <!-- Password Login Screen -->
    <div id="login-screen" class="max-w-md mx-auto mt-24 p-8 bg-white rounded-xl shadow-lg text-center">
        <h2 class="text-2xl font-bold mb-4 text-slate-900">Admin Authentication</h2>
        <p class="text-sm text-gray-500 mb-6">Enter your security key to access BAVIN inventory management.</p>
        <input type="password" id="admin-pass" placeholder="Enter Admin Password" class="w-full p-3 border rounded mb-4 text-center">
        <button onclick="checkPassword()" class="w-full bg-slate-900 text-white p-3 rounded font-bold hover:bg-slate-800">Unlock Panel</button>
    </div>

    <!-- Protected Admin Dashboard -->
    <div id="admin-content" class="hidden pb-12">
        <nav class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold">BAVIN Admin Control Panel</h1>
            <a href="index.html" class="text-xs bg-emerald-600 px-3 py-1.5 rounded font-semibold">View Live Catalogue</a>
        </nav>

        <div class="max-w-4xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-slate-800">Add New BAVIN Product</h2>
            <form id="add-product-form" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10 pb-8 border-b">
                <input type="text" id="new-name" placeholder="Product Name (e.g., BAVIN BH-50)" required class="p-2.5 border rounded text-sm">
                <input type="text" id="new-code" placeholder="Model Code (e.g., BH-50)" required class="p-2.5 border rounded text-sm">
                <select id="new-category" class="p-2.5 border rounded text-sm">
                    <option value="Audio">Audio & Wireless Headsets</option>
                    <option value="Power Banks">Power Banks & Chargers</option>
                </select>
                <input type="text" id="new-price" placeholder="Wholesale Price (e.g., 15.00)" required class="p-2.5 border rounded text-sm">
                <input type="text" id="new-desc" placeholder="Short description features" required class="p-2.5 border rounded text-sm md:col-span-2">
                <input type="text" id="new-img" placeholder="Image Path (e.g., ./bh50.jpg)" class="p-2.5 border rounded text-sm md:col-span-2">
                <button type="submit" class="md:col-span-2 bg-emerald-600 text-white p-3 rounded font-bold text-sm hover:bg-emerald-700">Add Product to Catalogue</button>
            </form>

            <h2 class="text-xl font-bold mb-4 text-slate-800">Manage & Edit Existing Inventory</h2>
            <div id="admin-product-list" class="space-y-6">
                <!-- Dynamically loaded editable items appear here -->
            </div>
        </div>
    </div>
</body>
</html>
